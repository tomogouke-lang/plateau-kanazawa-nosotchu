<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>三つ折りパンフレット確認用｜金沢脳卒中専門デイサービス</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      font-size: 18px;
      line-height: 1.7;
    }
    header {
      padding: 24px;
      border-bottom: 1px solid #d9dfeb;
      background: #fff;
    }
    .header-inner, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .brand { margin: 0 0 4px; color: #c4372a; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); line-height: 1.35; }
    main { padding: 32px 0 48px; }
    .notice { margin: 0 0 24px; color: #475569; }
    .viewer {
      overflow: hidden;
      min-height: 72vh;
      border: 1px solid #d9dfeb;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(15, 23, 42, .08);
    }
    iframe { display: block; width: 100%; min-height: 72vh; border: 0; }
    .fallback { margin: 24px 0 0; text-align: center; }
    .fallback a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #2348ad;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 640px) {
      header { padding: 16px 0; }
      main { padding-top: 24px; }
      .viewer, iframe { min-height: 68vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="brand">PDS PLATEAU</p>
      <h1>三つ折りパンフレット 最終確認用</h1>
    </div>
  </header>
  <main>
    <p class="notice">表面・裏面を切り替えてご確認ください。確認用ページのため、検索結果には表示しない設定です。</p>
    <div class="viewer">
      <iframe
        title="金沢脳卒中専門デイサービス 三つ折りパンフレット"
        src="https://www.canva.com/design/DAG1ZCGDv40/view?embed"
        allowfullscreen="allowfullscreen"
        loading="eager"></iframe>
    </div>
    <p class="fallback"><a href="https://www.canva.com/d/A5SQIUUzA99Ckc0" target="_blank" rel="noopener">パンフレットを別画面で開く</a></p>
  </main>
</body>
</html>
